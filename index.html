<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 QG ANDRÔMEDA — Centro de Comando</title>
    <meta name="theme-color" content="#1a3a70">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100vh;
            background: 
                radial-gradient(ellipse at top, #0a1a35 0%, #050d1f 40%, #000510 100%);
            font-family: 'Segoe UI', -apple-system, sans-serif;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        /* ESTRELAS DE FUNDO — DISCRETAS */
        .estrelas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .estrela {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: brilho 6s infinite alternate ease-in-out;
        }
        @keyframes brilho {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .caixa {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* CABEÇALHO */
        .cabecalho {
            text-align: center;
            padding: 20px 10px 14px;
            border-bottom: 1px solid rgba(80,140,255,0.15);
            margin-bottom: 18px;
        }
        h1 {
            font-size: 24px;
            color: #cce0ff;
            letter-spacing: 1px;
        }
        .subtitulo {
            font-size: 13px;
            color: #7799cc;
            margin-top: 4px;
        }

        /* ANDRÔMEDA — CENTRO */
        .centro {
            text-align: center;
            padding: 10px 0 20px;
        }
        .simbolo-andromeda {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            background: radial-gradient(circle, #4488ff, #1a44aa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 30px rgba(80,140,255,0.35);
        }
        .status-andromeda {
            margin-top: 10px;
            font-size: 14px;
            color: #88bbff;
        }
        .ponto {
            display: inline-block;
            width: 8px; height: 8px;
            background: #33ff88;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulso 2s infinite;
        }
        @keyframes pulso {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* GRID DE BOTÕES — LIMPO, 2 COLUNAS */
        .grade {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 520px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .botao {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 10px;
            background: rgba(30, 60, 120, 0.18);
            border: 1px solid rgba(80, 140, 255, 0.2);
            border-radius: 12px;
            text-decoration: none;
            color: #e0ebff;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .botao:active { transform: scale(0.97); }
        .botao:hover {
            background: rgba(40, 80, 150, 0.25);
            border-color: rgba(100, 160, 255, 0.35);
        }
        .icone { font-size: 22px; margin-bottom: 6px; }
        .nome { text-align: center; line-height: 1.3; }

        /* RODAPÉ */
        .rodape {
            margin-top: auto;
            text-align: center;
            padding: 14px;
            font-size: 11px;
            color: #5577aa;
            border-top: 1px solid rgba(80,140,255,0.1);
        }

        /* AJUSTE PARA TELAS PEQUENAS */
        @media (max-width: 360px) {
            .grade { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ESTRELAS DE FUNDO -->
<div class="estrelas" id="estrelas"></div>

<div class="caixa">

    <div class="cabecalho">
        <h1>🌌 QG ANDRÔMEDA</h1>
        <p class="subtitulo">Centro de Comando · Plataforma Inteligente</p>
    </div>

    <!-- SÍMBOLO E STATUS DA ANDRÔMEDA -->
    <div class="centro">
        <div class="simbolo-andromeda">A</div>
        <div class="status-andromeda">
            <span class="ponto"></span>Andrômeda Online · Aguardando
        </div>
    </div>

    <!-- 8 BOTÕES — TODOS COM FUNÇÃO REAL -->
    <div class="grade">

        <a href="inicio.html" class="botao">
            <span class="icone">🏠</span>
            <span class="nome">Início</span>
        </a>

        <a href="biblioteca.html" class="botao">
            <span class="icone">📚</span>
            <span class="nome">Biblioteca</span>
        </a>

        <a href="laboratorio.html" class="botao">
            <span class="icone">🧪</span>
            <span class="nome">Laboratório</span>
        </a>

        <a href="agentes.html" class="botao">
            <span class="icone">🤖</span>
            <span class="nome">Agentes</span>
        </a>

        <a href="missoes.html" class="botao">
            <span class="icone">📋</span>
            <span class="nome">Missões</span>
        </a>

        <a href="memoria.html" class="botao">
            <span class="icone">🧠</span>
            <span class="nome">Memória</span>
        </a>

        <a href="ferramentas.html" class="botao">
            <span class="icone">🛠️</span>
            <span class="nome">Ferramentas</span>
        </a>

        <a href="configuracoes.html" class="botao">
            <span class="icone">⚙️</span>
            <span class="nome">Configurações</span>
        </a>

    </div>

    <div class="rodape">
        QG Andrômeda · Centro de Comando · Versão 2.0 · 06/08/2026
    </div>

</div>

<script>
// GERA ESTRELAS DE FORMA DISCRETA
const container = document.getElementById('estrelas');
for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'estrela';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.width = s.style.height = (Math.random()*2 + 1) + 'px';
    s.style.animationDelay = (Math.random()*6) + 's';
    container.appendChild(s);
}
</script>

</body>
</html>
